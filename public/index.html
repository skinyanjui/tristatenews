<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tri-State News</title>
<meta name="description" content="Local news from across the Evansville, IN-KY metro, refreshed hourly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --background:#fff; --background-subtle:#fafafa; --foreground:#171717;
  --gray-100:#f2f2f2; --gray-200:#ebebeb; --gray-300:#e0e0e0; --gray-400:#c9c9c9;
  --gray-500:#a8a8a8; --gray-600:#8f8f8f; --gray-700:#666; --gray-800:#444; --gray-900:#2e2e2e; --gray-1000:#171717;
  --blue:#0070f3; --blue-subtle:#e6f0fd; --red:#e5484d; --red-strong:#c4262c; --amber:#f5a623; --green:#45a557;
  --border:var(--gray-300); --text-muted:var(--gray-700);
  --radius-sm:6px; --radius-md:6px; --radius-lg:6px; --radius-xl:6px;
  --shadow-md:0 4px 12px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --ease:cubic-bezier(.4,0,.2,1); --duration-fast:100ms; --duration-base:150ms;
  --font-sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
[data-theme="dark"] {
  --background:#0a0a0a; --background-subtle:#111; --foreground:#ededed;
  --gray-100:#1a1a1a; --gray-200:#1f1f1f; --gray-300:#2e2e2e; --gray-400:#454545;
  --gray-500:#878787; --gray-600:#a1a1a1; --gray-700:#b4b4b4; --gray-800:#d4d4d4; --gray-900:#e3e3e3; --gray-1000:#ededed;
  --blue:#3291ff; --blue-subtle:#10233c; --red:#ff6369; --red-strong:#ff6369; --amber:#f7b955; --green:#5dc36f;
  --shadow-md:0 4px 12px rgba(0,0,0,.5); --shadow-lg:0 12px 32px rgba(0,0,0,.6);
}
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--background); color:var(--foreground); font:400 14px/20px var(--font-sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; }
:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* top nav */
.nav { position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--background) 96%, transparent); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top); }
.nav-in { max-width:960px; margin:0 auto; padding:0 16px; height:48px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { display:inline-flex; align-items:center; min-height:32px; color:var(--foreground); text-decoration:none; font-size:15px; line-height:24px; font-weight:600; letter-spacing:-.01em; flex:none; }
.brand small { font:500 12px/16px var(--font-sans); color:var(--text-muted); letter-spacing:.01em; }
.wx { position:relative; }
.wx-btn { display:flex; align-items:center; gap:8px; min-height:32px; padding:0 10px; border-radius:var(--radius-md); border:1px solid var(--border); background:var(--background); font-weight:500; transition:background var(--duration-fast) var(--ease); }
.wx-btn:hover { background:var(--gray-100); }
.wx-temp { font-family:var(--font-mono); font-size:14px; }
.wx-cond { color:var(--text-muted); }
@media (max-width:479px) { .wx-cond { display:none; } .nav-r { gap:4px; } }
.wx-sk { width:88px; height:16px; border-radius:var(--radius-sm); }
.wx-pop { position:absolute; right:0; top:calc(100% + 8px); width:min(280px, calc(100vw - 32px)); background:var(--background); border:1px solid var(--border); border-radius:var(--radius-xl); box-shadow:var(--shadow-lg); padding:8px; opacity:0; transform:translateY(-4px); pointer-events:none; visibility:hidden; transition:opacity var(--duration-base) var(--ease), transform var(--duration-base) var(--ease), visibility 0s linear var(--duration-base); }
.wx-pop.open { opacity:1; transform:none; pointer-events:auto; visibility:visible; transition-delay:0s; }
.wx-head { padding:0 12px 8px; border-bottom:1px solid var(--border); margin-bottom:4px; }
.wx-head b { display:block; font-size:18px; line-height:24px; font-weight:600; letter-spacing:-.01em; }
.wx-head span { color:var(--text-muted); }
.wx-loc { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 12px; min-height:36px; }
.wx-loc button, .wx-pick button { min-height:44px; padding:0 12px; border-radius:var(--radius-md); font-weight:500; text-align:left; }
.wx-loc .chg { color:var(--blue); }
.wx-pick { display:grid; padding:4px; max-height:60vh; overflow:auto; }
.wx-pick button { display:flex; justify-content:space-between; align-items:center; width:100%; }
.wx-pick button:hover, .wx-loc button:hover { background:var(--gray-100); }
.wx-pick button[aria-current="true"] { background:var(--gray-100); }
.wx-search { margin:4px; min-height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--background); color:var(--foreground); width:calc(100% - 8px); }
.wx-note { padding:8px 12px; color:var(--text-muted); font-size:12px; line-height:16px; }
.wx-row { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; padding:4px 12px; min-height:32px; border-radius:var(--radius-md); }
.wx-row .d { font-weight:500; }
.wx-row .c { color:var(--text-muted); font-size:12px; line-height:16px; }
.wx-row .t { font-family:var(--font-mono); font-size:12px; line-height:16px; text-align:right; min-width:64px; }
.wx-row .p { display:flex; align-items:center; justify-content:flex-end; gap:3px; font-size:12px; line-height:16px; color:var(--blue); min-width:44px; }

/* nav right + theme */
.nav-r { display:flex; align-items:center; gap:8px; flex:none; }
.icon-btn { width:32px; height:32px; display:grid; place-items:center; border-radius:var(--radius-md); border:0; background:transparent; color:var(--foreground); transition:background var(--duration-fast) var(--ease); }
.icon-btn:hover { background:var(--gray-100); }
.icon-btn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* banners: breaking news + weather */
.banners { display:grid; gap:8px; margin-bottom:12px; }
.banners:not(:has(.bn:not([hidden]))) { display:none; }
.bn { display:flex; align-items:center; gap:12px; min-height:44px; padding:8px 12px 8px 16px; border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius-lg); background:var(--background-subtle); min-width:0; }
.bn[hidden] { display:none; }
.bn-break { border-left-color:var(--red); }
.bn .tag { flex:none; font-size:11px; line-height:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.bn-break .tag { color:var(--red); }
.bn .tx { flex:1; min-width:0; }
.bn .tx a { color:var(--foreground); text-decoration:none; font-weight:600; overflow-wrap:anywhere; }
.bn .tx a:hover { text-decoration:underline; }
.bn .tx .by { display:block; color:var(--text-muted); font-size:12px; line-height:16px; }
.bn .tx .by a { color:inherit; font-weight:400; text-decoration:underline; }
.bn .x { flex:none; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--radius-md); color:var(--text-muted); font-size:18px; line-height:1; }
.bn .x:hover { background:var(--gray-100); }
@media (max-width:479px) { .bn { align-items:flex-start; flex-wrap:wrap; } .bn .tag { width:100%; } }

/* jobs */
.job { border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; display:grid; gap:8px; align-content:start; min-width:0; background:var(--background); }
.job-head { display:flex; align-items:center; gap:8px; min-height:28px; flex-wrap:wrap; }
.job-co { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); min-width:0; overflow-wrap:anywhere; }
.job-type { margin-left:auto; flex:none; display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:var(--radius-md); font-size:12px; line-height:16px; font-weight:600; background:var(--blue-subtle); color:var(--blue); }
.job-title { margin:0; font-size:16px; line-height:24px; font-weight:600; overflow-wrap:anywhere; }
.job-pay { font-family:var(--font-mono); font-weight:500; }
.job-apply { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; font-size:12px; line-height:16px; color:var(--text-muted); }
.job-apply a { display:inline-flex; align-items:center; min-height:44px; padding:0 14px; border-radius:var(--radius-md); background:var(--foreground); color:var(--background); font-size:14px; font-weight:500; overflow-wrap:anywhere; }
.job-apply a:hover { opacity:.88; }
.job-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.job-grid { grid-template-columns:1fr; }
@media (min-width:720px) { .job-grid { grid-template-columns:1fr 1fr; } }
.job-links { display:flex; flex-wrap:wrap; gap:4px 16px; }

/* weather alerts */
.alerts { display:grid; gap:8px; margin-bottom:16px; }
.alerts:empty { display:none; }
.alert { --sev:var(--blue); border:1px solid var(--sev); border-radius:var(--radius-lg); background:color-mix(in srgb, var(--sev) 16%, var(--background)); color:var(--foreground); }
.alert.sev-severe { --sev:var(--red); }
.alert.sev-mod { --sev:var(--amber); }
.alert.sev-minor { --sev:var(--blue); }
.alert .ah { display:flex; align-items:center; gap:4px; min-height:44px; padding:4px 4px 4px 16px; }
.alert .at { flex:1; min-width:0; display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:44px; text-align:left; font-weight:500; cursor:pointer; }
.alert .at .rt span { color:var(--foreground); opacity:.75; font-weight:400; font-size:12px; line-height:16px; text-align:right; }
.alert .ai { flex:none; display:inline-flex; margin-right:10px; }
.alert .ai svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.alert .at b { flex:1; min-width:0; }
.alert .rt { flex:none; display:inline-flex; align-items:center; gap:8px; }
.alert .bar { width:56px; height:6px; border-radius:3px; background:color-mix(in srgb, var(--sev) 25%, transparent); overflow:hidden; }
.alert .bar i { display:block; height:100%; background:var(--sev); border-radius:3px; }
.alert .al { flex:none; display:inline-flex; align-items:center; min-height:44px; padding:0 8px; font-size:13px; font-weight:600; color:inherit; text-decoration:underline; }
.alert .ax { flex:none; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--radius-md); font-size:20px; line-height:1; }
.alert .ax:hover, .alert .al:hover { background:color-mix(in srgb, var(--sev) 20%, transparent); }
.alert .ab[hidden] { display:none; }
@media (max-width:479px) { .alert .at .rt span { display:none; } .alert .bar { width:40px; } }
.alert .ab { padding:0 16px 12px; color:var(--foreground); }
.alert .ab p { margin:0 0 8px; }

/* page */
main { max-width:960px; margin:0 auto; padding:16px 16px 96px; }
.head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px; }
h1 { margin:0; font-size:24px; line-height:32px; font-weight:600; letter-spacing:-.015em; }
.meta { color:var(--text-muted); font-size:12px; line-height:16px; margin-top:4px; }
.nav-q { flex:1 1 auto; min-width:0; max-width:420px; }
.q { width:100%; min-height:32px; height:32px; padding:0 10px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--background); color:var(--foreground); font:inherit; }
.q::placeholder { color:var(--gray-600); }
.nav-tabs { max-width:960px; margin:0 auto; padding:0 16px; }
.tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; margin-left:-12px; }
.tabs::-webkit-scrollbar { display:none; }
.tab { flex:none; min-height:36px; padding:0 12px; font-weight:500; color:var(--text-muted); border-bottom:2px solid transparent; display:inline-flex; align-items:center; gap:8px; }
.tab:hover { color:var(--foreground); }
.tab[aria-selected="true"] { color:var(--foreground); border-bottom-color:var(--foreground); }
.tab .n { font-family:var(--font-mono); font-size:12px; color:var(--text-muted); }
.card.breaking { border-color:var(--red); background:var(--background); }
.card.breaking a { display:block; padding:0; }
.card.breaking .th, .card.breaking .ph { width:100%; height:auto; aspect-ratio:16/9; max-height:320px; border-radius:0; }
.card.breaking .ph { aspect-ratio:auto; height:112px; }
.card.breaking .bd { padding:16px; }
.card.breaking h2 { font-size:22px; line-height:30px; letter-spacing:-.01em; }
.card.breaking p { display:block; font-size:14px; }
.card.breaking .like { background:color-mix(in srgb, var(--background) 88%, transparent); }
.bk { position:absolute; top:12px; left:12px; z-index:1; display:inline-flex; align-items:center; gap:6px; padding:0 8px; min-height:20px; border-radius:var(--radius-md); background:#c4262c; color:#fff; font-size:11px; line-height:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; box-shadow:0 1px 4px rgba(0,0,0,.25); }
.bk i { width:6px; height:6px; border-radius:50%; background:#fff; animation:pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { opacity:.3; } }
[hidden] { display:none !important; }
.cl { display:grid; gap:12px; margin-bottom:16px; }
.cl-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.cl-bar .ev-town { min-width:0; flex:1; max-width:320px; }
.cl-bar .ev-town select { width:100%; font-weight:600; }
.cl-go { min-height:36px; padding:0 14px; border-radius:var(--radius-md); background:var(--foreground); color:var(--background); font-weight:500; }
.cl-go:disabled { opacity:.5; }
.cl-form { display:grid; gap:14px; border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
.cl-f { display:grid; gap:4px; min-width:0; position:relative; }
.cl-f > label { font-size:12px; line-height:16px; font-weight:500; color:var(--text-muted); }
.cl-f input, .cl-f select, .cl-f textarea { width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--background); color:var(--foreground); font:inherit; min-width:0; }
.cl-f input:focus-visible, .cl-f select:focus-visible, .cl-f textarea:focus-visible, .cl-seg button:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }
.cl-f [aria-invalid="true"] { border-color:var(--red); }
.cl-f textarea { resize:vertical; }
.cl-hint, .cl-count { color:var(--text-muted); font-size:12px; line-height:16px; }
.cl-count { text-align:right; }
.cl-fe, .cl-err { color:var(--red); font-size:12px; line-height:16px; }
.cl-fe:empty, .cl-err:empty { display:none; }
.cl-two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:479px) { .cl-two { grid-template-columns:1fr; } }
.cl-pricerow { display:flex; align-items:center; gap:12px; }
.cl-price-in { position:relative; flex:1; min-width:0; }
.cl-price-in span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
.cl-price-in input { padding-left:24px; }
.cl-check { display:inline-flex; align-items:center; gap:8px; min-height:44px; font-weight:500; flex:none; }
.cl-check input { width:24px; min-height:24px; height:24px; margin:0; }
.cl-seg { display:flex; flex-wrap:wrap; gap:8px; }
.cl-seg button { min-height:36px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-md); font-weight:500; color:var(--text-muted); }
.cl-seg button[aria-checked="true"] { background:var(--foreground); color:var(--background); border-color:var(--foreground); }
.cl-wide { width:100%; min-height:44px; }
.cl-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.cl-chips::-webkit-scrollbar { display:none; }
.cl-chip { flex:none; min-height:32px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-md); font-weight:500; font-size:12px; color:var(--text-muted); }
.cl-chip[aria-pressed="true"] { background:var(--foreground); color:var(--background); border-color:var(--foreground); }
.cl-tag { display:inline-flex; align-items:center; flex:none; padding:0 8px; min-height:20px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--gray-100); font-size:11px; line-height:16px; font-weight:500; color:var(--text-muted); white-space:nowrap; }
.deal-grid { grid-template-columns:1fr; }
@media (min-width:720px) { .deal-grid, #ev .cl-list { grid-template-columns:1fr 1fr; } }
.deal { display:grid; gap:6px; align-content:start; border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; background:var(--background); }
.deal-head { display:flex; align-items:center; gap:8px; min-height:20px; }
.deal-biz { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); }
.deal-offer { margin:0; font-size:20px; line-height:26px; font-weight:600; letter-spacing:-.01em; text-wrap:balance; overflow-wrap:anywhere; }
.deal-code { display:flex; align-items:center; gap:8px; margin-top:4px; font-size:12px; line-height:16px; color:var(--text-muted); }
.deal-code code { font-family:var(--font-mono); font-size:14px; letter-spacing:.06em; color:var(--foreground); border:1px dashed var(--gray-500); border-radius:var(--radius-sm); padding:4px 10px; user-select:all; }
/* search */
.nav-q { position:relative; }
.qsug { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:30; min-width:min(300px, calc(100vw - 32px)); background:var(--background); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:6px; max-height:60vh; overflow:auto; }
.qsug[hidden] { display:none; }
@media (max-width:639px) { .qsug { position:fixed; left:16px; right:16px; top:calc(52px + env(safe-area-inset-top, 0px)); min-width:0; } }
.sug-h { display:flex; align-items:center; justify-content:space-between; min-height:32px; padding:0 10px; color:var(--text-muted); font-size:11px; line-height:16px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.sug-clear { min-height:32px; padding:0 8px; color:var(--blue); font-size:12px; font-weight:500; text-transform:none; letter-spacing:0; }
.qsug .opt { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 10px; border-radius:var(--radius-md); text-align:left; }
.qsug .opt svg { width:16px; height:16px; fill:none; stroke:var(--text-muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.qsug .opt[aria-selected="true"], .qsug .opt:hover { background:var(--gray-100); }
mark { background:color-mix(in srgb, var(--amber) 38%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
.sr { display:grid; gap:16px; }
.sr[hidden] { display:none; }
.ev-filters { display:grid; gap:8px; margin-bottom:8px; }
@media (min-width:720px) { .ev-filters { grid-template-columns:1fr auto; align-items:center; } }
.ev-town select { min-height:44px; padding:0 10px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--background); color:var(--foreground); font:inherit; max-width:100%; }
.cl-empty { display:grid; gap:12px; justify-items:start; }
.sr-bar { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
.sr-bar::-webkit-scrollbar { display:none; }
.sr-sec { display:grid; gap:12px; }
.sr-h { margin:8px 0 0; display:flex; align-items:center; gap:8px; font-size:18px; line-height:24px; font-weight:600; letter-spacing:-.01em; }
.sr-h .n { font:500 12px/16px var(--font-mono); color:var(--text-muted); }
.sr-more { justify-self:start; }
.sr-mean { color:var(--blue); font-weight:600; text-decoration:underline; min-height:32px; }
.sr-try { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
@media (min-width:720px) { .ev-grid { grid-template-columns:1fr 1fr; } }
/* event cards */
.ev.ev-plain { flex-direction:row; align-items:flex-start; gap:16px; padding:16px; }
.ev-plain .ev-body { padding:0; gap:6px; }
.ev-date { flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; width:80px; min-height:64px; padding:8px 0; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--gray-100); }
.ev-mo { font-size:12px; line-height:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--red-strong); }
.ev-wd { font-size:12px; line-height:16px; font-weight:500; color:var(--text-muted); }

      render();
      loadCounts();
    }).catch(function () {
      state.error = true; state.loaded = true;
      render();
    });
  }


  // hourly refresh while open, plus catch-up when the tab becomes visible after a long time away
  setInterval(function () { load(false); }, HOUR);
  // weather updates continuously: every 10 minutes, and right away when the tab returns or the connection comes back
  var WX_EVERY = 10 * 60 * 1000, wxAt = Date.now();
  function wxTick() { if (wxPop.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return; wxAt = Date.now(); loadWeather(); }
  setInterval(function () { if (!document.hidden) wxTick(); }, WX_EVERY);
  window.addEventListener('online', wxTick);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (Date.now() - state.fetchedAt > HOUR) load(false);
    if (Date.now() - wxAt > 2 * 60 * 1000) wxTick();
  });
  // keep "x min ago" honest
  setInterval(function () { if (state.items.length && !document.hidden) render(); }, 5 * 60 * 1000);

  loadWeather();
  load(false);
  loadDeals(); loadBoard('event'); loadBoard('job');
})();
</script>
</body>
</html>
