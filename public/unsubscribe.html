<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="imgrimRmsdx3n0xLUgcG6A2o24uvOpP_ApcVkTKElNY" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Unsubscribe · Tri-State News</title>
<meta name="description" content="Stop getting the Tri-State News email newsletter.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/legal.css">
<style>
.un-form { display:grid; gap:8px; max-width:440px; margin:16px 0 8px; }
.un-form label { font-weight:600; font-size:15px; }
.un-form input { min-height:44px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--background); color:var(--foreground); font:inherit; }
.un-form input:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
.un-go { min-height:44px; padding:0 16px; border:0; border-radius:var(--radius); background:var(--brand); color:#fff; font:600 15px/1 var(--font-sans); cursor:pointer; justify-self:start; }
[data-theme="dark"] .un-go { color:#04222b; }
.un-go[disabled] { opacity:.6; cursor:default; }
.un-msg { min-height:24px; max-width:60ch; margin:8px 0 0; }
.un-msg.ok { padding:12px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--background-subtle); }
.un-msg.err { color:#c4262c; }
[data-theme="dark"] .un-msg.err { color:#ff6369; }
.un-hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
</style>
<script>try{var t=localStorage.getItem('tsn.theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="lg-top"><div class="lg-top-in"><a class="lg-brand" href="/">Tristate</a><a class="lg-back" href="/">Back to the news</a></div></header>
<main id="main">
<h1>Unsubscribe</h1>
<p class="lg-lede">Stop getting the Tri-State News email newsletter. Enter the address it comes to.</p>
<form class="un-form" id="unForm" method="post" action="/api/unsubscribe" novalidate>
  <label for="unEmail">Email address</label>
  <input id="unEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="80" required placeholder="name@email.com" aria-describedby="unMsg">
  <div class="un-hp" aria-hidden="true"><label for="unWebsite">Leave this empty</label><input id="unWebsite" name="website" tabindex="-1" autocomplete="off"></div>
  <input type="hidden" name="token" id="unToken">
  <button class="un-go" id="unGo" type="submit">Unsubscribe</button>
</form>
<p class="un-msg" id="unMsg" role="status" aria-live="polite"></p>
<p class="lg-meta">We only use your address for the newsletter. Changed your mind? You can sign up again under the news feed. Questions: see <a href="/legal#contact">Legal &amp; contact</a>.</p>
</main>
<footer class="lg-foot"><div class="lg-foot-in"><p><a href="/legal">Legal</a> · <a href="/legal#privacy">Privacy</a></p></div></footer>
<script>
(function () {
  'use strict';
  var f = document.getElementById('unForm'), em = document.getElementById('unEmail'), tk = document.getElementById('unToken');
  var go = document.getElementById('unGo'), msg = document.getElementById('unMsg'), hp = document.getElementById('unWebsite');
  var RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  var q = new URLSearchParams(location.search);
  if (q.get('email')) em.value = q.get('email');
  if (q.get('token')) tk.value = q.get('token');
  function say(text, kind) { msg.textContent = text; msg.className = 'un-msg' + (kind ? ' ' + kind : ''); }
  function submit() {
    var v = em.value.trim();
    if (!RE.test(v)) { say('Enter a valid email address.', 'err'); em.setAttribute('aria-invalid', 'true'); em.focus(); return; }
    em.removeAttribute('aria-invalid'); go.disabled = true; go.textContent = 'Unsubscribing…'; say('');
    fetch('/api/unsubscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: v, token: tk.value || undefined, website: hp.value || undefined }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }, function () { return { ok: false, d: {} }; }); })
      .then(function (o) {
        go.disabled = false; go.textContent = 'Unsubscribe';
        if (!o.ok) { say((o.d && o.d.error) || 'Couldn’t do that just now. Try again in a moment.', 'err'); return; }
        try { localStorage.removeItem('tsn.nl'); } catch (e) {} // show the signup box again on this browser
        say(o.d.message || 'Done.', 'ok');
      })
      .catch(function () { go.disabled = false; go.textContent = 'Unsubscribe'; say('Couldn’t reach the server. Check your connection and try again.', 'err'); });
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
  // Opened from a newsletter's personal link (email + token): do it right away.
  if (q.get('email') && q.get('token')) submit();
})();
</script>
</body>
</html>
